name: Build and publish Foundry module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/package

          jq --arg version "$VERSION" \
            '.version = $version
             | .download = "https://github.com/RubioJJ/vtm5e-codex/releases/latest/download/module.zip"
             | .manifest = "https://github.com/RubioJJ/vtm5e-codex/releases/latest/download/module.json"' \
            module.json > dist/module.json

          cp -R packs scripts styles assets README.md LICENSE dist/package/
          cp dist/module.json dist/package/module.json

          cd dist/package
          zip -r ../module.zip .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VTM5e Codex ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/module.json
            dist/module.zip

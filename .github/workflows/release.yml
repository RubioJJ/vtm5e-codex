name: Build and publish Foundry module
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version module.json)"
          mkdir -p dist/package
          jq --arg version "$VERSION" '.version = $version | .download = "https://github.com/RubioJJ/vtm5e-codex/releases/latest/download/module.zip" | .manifest = "https://github.com/RubioJJ/vtm5e-codex/releases/latest/download/module.json"' module.json > dist/module.json
          cp -R packs scripts styles assets data templates README.md LICENSE dist/package/
          cp dist/module.json dist/package/module.json
          cd dist/package
          zip -r ../module.zip .
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          target_commitish: main
          name: VTM5e Codex v0.2.0
          generate_release_notes: true
          files: |
            dist/module.json
            dist/module.zip
